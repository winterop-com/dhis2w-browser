site_name: dhis2w-browser
site_description: Playwright-driven DHIS2 UI automation - a dhis2w plugin pack.
site_url: https://winterop-com.github.io/dhis2w-browser/
repo_url: https://github.com/winterop-com/dhis2w-browser
repo_name: winterop-com/dhis2w-browser
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Browser automation: index.md
  - Playwright PAT helper: pat-helper.md
  - dhis2w: https://winterop-com.github.io/dhis2w/
